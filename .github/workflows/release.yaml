name: Release pipeline

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish the release, otherwise build artifacts and dry-run."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-haskell-debugger:
    uses: ./.github/workflows/debugger.yaml
    # Build and Test using the haskell-debugger sdist and haskell-debugger-view
    # from hackage. This requires that haskell-debugger-view on hackage be
    # compatible with the version being released.
    with:
      is-release: true

  # The per-distro Linux bindists live in their own reusable workflow (rather
  # than behind `if: inputs.is-release` in debugger.yaml) so that regular CI
  # runs don't report dozens of skipped jobs on every pull request.
  build-hdb-bindists:
    uses: ./.github/workflows/bindists.yaml

  # Install the bindists built above the two ways users do, and check that `hdb`
  # starts (see bindist/test-install.sh). Only bindists that the CI runners can
  # execute are covered: one per OS/architecture, not each Linux distribution.
  # The release job below needs this, so a broken bindist is never published.
  test-hdb-bindists:
    name: Test bindist (${{ matrix.artifact.name }}, ${{ matrix.mode }})
    needs: build-hdb-bindists
    strategy:
      fail-fast: false
      matrix:
        mode: [extract, ghcup]
        # `name` is the artifact uploaded by bindists.yaml.
        artifact:
          - { name: hdb-x86_64-linux-unknown,     runner: ubuntu-latest }
          - { name: hdb-aarch64-linux-ubuntu2404, runner: ubuntu-24.04-arm }
          - { name: hdb-aarch64-apple-darwin,     runner: macOS-latest }
          - { name: hdb-x86_64-apple-darwin,      runner: macos-15-intel }
    uses: ./.github/workflows/test-install.yaml
    with:
      artifact: ${{ matrix.artifact.name }}
      runner: ${{ matrix.artifact.runner }}
      mode: ${{ matrix.mode }}

  docs-haskell-debugger:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
          cabal-version: 3.16
          ghcup-release-channel: https://raw.githubusercontent.com/haskell/ghcup-metadata/refs/heads/develop/ghcup-prereleases-0.0.9.yaml

      - name: Build docs for haskell-debugger
        run: cabal haddock --haddock-for-hackage --enable-documentation lib:haskell-debugger

      - name: Upload haskell-debugger docs
        uses: actions/upload-artifact@v4
        with:
          name: Haskell Debugger Docs
          path: dist-newstyle/haskell-debugger*docs.tar.gz

  validate-tag:
    name: Validate tag is at master HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag points to master HEAD
        if: inputs.publish
        shell: bash
        run: |
          echo "Tag ref: $GITHUB_REF"
          echo "Tag commit: $GITHUB_SHA"

          # Fetch latest master explicitly
          git fetch origin master

          MASTER_SHA=$(git rev-parse origin/master)
          echo "origin/master HEAD: $MASTER_SHA"

          if [[ "$GITHUB_SHA" != "$MASTER_SHA" ]]; then
            echo "Tag does not point to the tip of master."
            echo "Tag SHA:     $GITHUB_SHA"
            echo "Master SHA:  $MASTER_SHA"
            exit 1
          fi

          echo "Tag is exactly at master HEAD."

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build-haskell-debugger, build-hdb-bindists, test-hdb-bindists, docs-haskell-debugger]
    env:
      ## handles inputs.publish being null on push.
      DRY_RUN: ${{ inputs.publish && 'false' || 'true'  }}
      PUBLISH: ${{ inputs.publish && 'true'  || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: Haskell Debugger Extension
          path: ${{ runner.temp }}/extension/

      - uses: actions/download-artifact@v4
        with:
          name: Haskell Debugger Source Distribution
          path: ${{ runner.temp }}/packages/

      - uses: actions/download-artifact@v4
        with:
          name: Haskell Debugger Docs
          path: ${{ runner.temp }}/docs/

      - uses: actions/download-artifact@v4
        with:
          pattern: hdb-*
          path: ${{ runner.temp }}/hdb-binaries/
          merge-multiple: true

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: ${{ env.DRY_RUN }}
          pat: ${{ env.DRY_RUN == 'true' && 'dry-run-stub' || secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ runner.temp }}/extension/haskell-debugger-extension-0.14.0.vsix

      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          dryRun: ${{ env.DRY_RUN }}
          pat: ${{ env.DRY_RUN == 'true' && 'dry-run-stub' || secrets.OPEN_VSX_TOKEN }}
          registryUrl: https://open-vsx.org
          extensionFile: ${{ runner.temp }}/extension/haskell-debugger-extension-0.14.0.vsix

      - name: Hackage Release
        uses: haskell-actions/hackage-publish@v1
        with:
          publish: ${{ env.PUBLISH }}
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: ${{ runner.temp }}/packages
          docsPath: ${{ runner.temp }}/docs

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ env.DRY_RUN }}
          files: |
            ${{ runner.temp }}/extension/*.vsix
            ${{ runner.temp }}/hdb-binaries/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
