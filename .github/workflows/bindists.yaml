    name: Bindist hdb Linux (unknown)
    needs: build-hdb-linux-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download hdb build artifacts (unknown)
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-build-x86_64-linux-unknown-*
          merge-multiple: true
          path: ./

      - name: Merge hdb bindist (unknown)
        uses: ./.github/actions/bindist-actions/action-unknown
        with:
          stage: BINDIST
        env:
          HDB_VERSION: ${{ env.haskellDebuggerVersion }}
          ARTIFACT: x86_64-linux-unknown

      - name: Upload hdb binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdb-x86_64-linux-unknown
          path: hdb-*.tar.gz

  # Platforms that ship a single bindist for the whole architecture, so they
  # need neither the per-distro containers nor the BUILD/BINDIST split above:
  # they are built natively on the runner. hdb is rebuilt here rather than
  # reused from debugger.yaml, whose matching legs exist to run the test suite
  # on these architectures before a release goes out.
  bindist-hdb-native:
    name: Bindist hdb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64-apple-darwin
            runner: macOS-latest
            version: 9.14.1
            channel: https://raw.githubusercontent.com/haskell/ghcup-metadata/master/ghcup-0.0.9.yaml
          - arch: x86_64-apple-darwin
            runner: macos-15-intel
            version: 9.14.1
            channel: https://raw.githubusercontent.com/haskell/ghcup-metadata/master/ghcup-0.0.9.yaml
          - arch: aarch64-linux-ubuntu2404
            runner: ubuntu-24.04-arm
            version: 9.14.1
            channel: https://raw.githubusercontent.com/haskell/ghcup-metadata/master/ghcup-0.0.9.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.version }}
          cabal-version: 3.16
          ghcup-release-channel: ${{ matrix.channel }}

      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Build and package hdb (${{ matrix.arch }})
        env:
          HDB_VERSION: ${{ env.haskellDebuggerVersion }}-ghcup
          ARCH: ${{ matrix.arch }}
          OUT_DIR: dist-bin
        run: |
          cabal build hdb --enable-executable-dynamic
          ./scripts/mk-bindist.sh

      - name: Upload hdb binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdb-${{ matrix.arch }}
          path: hdb-*.tar.gz

