on:
  workflow_call: {}

env:
  haskellDebuggerVersion: 0.13.2.0

name: Build hdb binary distributions
jobs:
  build-hdb-linux-deb10:
    name: Build hdb Linux (deb10, GHC ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [9.14.1]
        include:
          - version: 9.14.1
            channel: https://raw.githubusercontent.com/haskell/ghcup-metadata/master/ghcup-0.0.9.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package hdb (deb10)
        uses: ./.github/actions/bindist-actions/action-deb10
        with:
          stage: BUILD
          version: ${{ matrix.version }}
        env:
          GHCUP_CHANNEL: ${{ matrix.channel }}
          HDB_VERSION: ${{ env.haskellDebuggerVersion }}
          ARTIFACT: x86_64-linux-deb10

      - name: Upload hdb build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-x86_64-linux-deb10-${{ matrix.version }}
          path: out-x86_64-linux-deb10-${{ matrix.version }}.tar

  build-hdb-linux-deb11:
