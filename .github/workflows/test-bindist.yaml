# Check on pull requests that the hdb bindist can be installed and run, both
# unpacked by hand and with ghcup (see bindist/test-install.sh).
#
# The release pipeline (bindists.yaml) builds a bindist for every supported
# Linux distribution, which is too slow for every PR. This workflow instead
# builds one bindist natively per OS and only runs when something that goes
# into the bindist (or this test) changes.
#
# Two stages:
#   build-bindist  builds the bindist tarball once per platform
#   test-bindist   installs that tarball and runs `hdb`, as one job per
#                  (platform, install mode), so each combination passes or
#                  fails on its own. The steps live in test-install.yaml,
#                  which release.yaml also uses to test the release artifacts.

name: Test bindist

on:
  pull_request:
    paths:
      - bindist/**
      - scripts/mk-bindist.sh
      - .github/workflows/test-bindist.yaml
      - .github/workflows/test-install.yaml
      # mk-bindist.sh takes the version from here.
      - haskell-debugger.cabal
  workflow_dispatch: {}

# A newer push to the same pull request supersedes a run that is still going.
# Other runs get a group of their own, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-bindist:
    name: Build bindist (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `arch` is the suffix of the bindist tarball name. For macOS it is the
        # name used by the release pipeline, which builds it the same way. On
        # Linux the release pipeline builds in containers, one per distribution
        # (bindists.yaml), so this native build on the runner gets a name of its
        # own.
        platform:
          - { arch: x86_64-linux-native, runner: ubuntu-latest }
          - { arch: aarch64-apple-darwin, runner: macOS-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The macOS runner image has Command Line Tools 27 (SDK 27.0) next to
      # Xcode 26.6, whose linker cannot read the SDK 27 .tbd stubs ("tapi error:
      # malformed file ... unknown architecture arm64e.x1"). Use the Command
      # Line Tools toolchain so the linker and the SDK match. Same workaround
      # as in debugger.yaml; remove it together with that one once
      # https://github.com/actions/runner-images/issues/14940 is fixed.
      - name: Use Command Line Tools toolchain on macOS
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: "Cache GHC for macOS" # See haskell-actions/setup#139
        uses: actions/cache@v5
        if: matrix.platform.runner == 'macOS-latest'
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghc-9.14.1
          restore-keys: ${{ runner.os }}-ghc-9.14.1

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: 9.14.1
          cabal-version: 3.16
          ghcup-release-channel: https://raw.githubusercontent.com/haskell/ghcup-metadata/master/ghcup-0.0.9.yaml

      # mk-bindist.sh uses patchelf to point the executable at the bundled lib/.
      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Configure the build
        run: cabal build hdb --enable-executable-dynamic --dry-run
        # This generates dist-newstyle/cache/plan.json for the cache key.

      # Only an exact match is restored (no restore-keys): mk-bindist.sh
      # bundles every library in the cabal store, so the store must hold only
      # the packages of this build plan.
      - name: Restore cached dependencies
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: bindist-${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-plan-${{ hashFiles('**/plan.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build hdb --enable-executable-dynamic --only-dependencies

      - name: Save cached dependencies
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Same build as the "native" bindist job of the release pipeline
      # (bindists.yaml). This leaves hdb-<version>-ghcup-<arch>.tar.gz in the
      # working directory.
      - name: Build the bindist
        env:
          ARCH: ${{ matrix.platform.arch }}
          OUT_DIR: dist-bin
        run: |
          cabal build hdb --enable-executable-dynamic
          ./scripts/mk-bindist.sh

      - name: Upload the bindist
        uses: actions/upload-artifact@v7
        with:
          name: bindist-${{ matrix.platform.arch }}
          path: hdb-*.tar.gz

  # One call of the reusable workflow per (platform, install mode), so each
  # combination passes or fails on its own.
  test-bindist:
    name: Test bindist (${{ matrix.platform.arch }}, ${{ matrix.mode }})
    needs: build-bindist
    strategy:
      fail-fast: false
      matrix:
        # Every platform is tested with every install mode (see
        # bindist/test-install.sh):
        #   extract  unpack the tarball by hand, symlink `hdb` onto PATH
        #   ghcup    `ghcup install haskell-debugger` from a temporary release
        #            channel that points at the tarball
        mode: [extract, ghcup]
        platform:
          - { arch: x86_64-linux-native, runner: ubuntu-latest }
          - { arch: aarch64-apple-darwin, runner: macOS-latest }
    uses: ./.github/workflows/test-install.yaml
    with:
      artifact: bindist-${{ matrix.platform.arch }}
      runner: ${{ matrix.platform.runner }}
      mode: ${{ matrix.mode }}
